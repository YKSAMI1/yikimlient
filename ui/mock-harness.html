<!doctype html>
<!-- MOCK HARNESS — vite dev sunucuda gerçek modül grafiğini mock Tauri ile çalıştırır.
     Boot testi: TauriEvent bilerek tanımsız (gerçek global bundle davranışı).

     Sorgu parametreleri:
       ?hesap=ms        → premium (microsoft) hesap; skin merkezi açılır
       ?hesap=offline   → çevrimdışı hesap; "Orijinal hesap ile girmen lazım" kapısı
       ?sayfa=skins     → açılışta skin merkezine git
       ?onboarding=1    → ilk kurulum sihirbazını göster (hesap yok / kurulum yok)
-->
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>YIKIMLient — mock</title>
<script>
  // Arka plan sekmesinde rAF/timer kısıldığı için animasyon yolları takılır;
  // mock'ta reduced-motion zorla açık (motion.ts tamamen bypass) + rAF setTimeout köprüsü.
  var _mm = window.matchMedia;
  window.matchMedia = function (q) {
    var m = _mm.call(window, q);
    if (String(q).indexOf("prefers-reduced-motion") !== -1) {
      return { matches: true, media: q, addEventListener: function () {}, removeEventListener: function () {}, addListener: function () {}, removeListener: function () {} };
    }
    return m;
  };
  window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(performance.now()); }, 16); };
  (function () {
    var q = new URLSearchParams(location.search);
    var premium = q.get("hesap") !== "offline";
    var hesapTuru = premium ? "microsoft" : "offline";
    var onboarding = q.get("onboarding") === "1";
    var sayfa = q.get("sayfa") || "";

    /* ---- sahte skin / pelerin dokuları (data: URL) ---- */
    function bosTuval(w, h) {
      var c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      return c;
    }
    function skinUrl(ten, kiyafet, sac) {
      var c = bosTuval(64, 64), g = c.getContext("2d");
      function blok(x, y, w, h, renk) { g.fillStyle = renk; g.fillRect(x, y, w, h); }
      // kafa + yüz
      blok(0, 0, 32, 16, ten);
      blok(8, 8, 8, 8, ten);
      blok(9, 10, 2, 2, "#1b1b1f");
      blok(13, 10, 2, 2, "#1b1b1f");
      blok(11, 14, 2, 1, "#7a3b2a");
      blok(8, 8, 8, 2, sac);
      // gövde / kollar / bacaklar
      blok(16, 16, 24, 16, kiyafet);
      blok(40, 16, 16, 16, ten);
      blok(32, 48, 16, 16, ten);
      blok(0, 16, 16, 16, "#2c3e50");
      blok(16, 48, 16, 16, "#2c3e50");
      // hafif gölge (dokunun düz görünmemesi için)
      blok(20, 20, 8, 12, kiyafet);
      // ÜST KATMANLAR (şapka / ceket / kolluk / pantolon) — kartlarda görünmeli.
      // Gerçek skinlerde bu piksellerin çoğu saydamdır; burada görünür olsun diye
      // yalnız ön yüzler ve kenarlar boyanır.
      blok(32, 0, 32, 8, sac);           // şapka üstü + yanları
      blok(32, 8, 8, 8, sac);            // şapka sağ yan
      blok(48, 8, 8, 8, sac);            // şapka sol yan
      blok(56, 8, 8, 8, sac);            // şapka arka
      blok(40, 8, 8, 2, sac);            // alın bandı (yüz görünsün)
      blok(20, 36, 8, 12, kiyafet);      // ceket önü
      blok(20, 36, 8, 1, "#1b1b1f");     // yaka
      blok(44, 36, 4, 12, "#7a5230");    // sağ kolluk
      blok(52, 52, 4, 12, "#7a5230");    // sol kolluk
      blok(4, 36, 4, 12, "#1e2b3a");     // sağ pantolon
      blok(4, 52, 4, 12, "#1e2b3a");     // sol pantolon
      return c.toDataURL("image/png");
    }
    function pelerinUrl(renk, kenar) {
      var c = bosTuval(64, 32), g = c.getContext("2d");
      function panel(px) {
        g.fillStyle = renk; g.fillRect(px, 1, 10, 16);
        g.fillStyle = kenar; g.fillRect(px, 1, 10, 2); g.fillRect(px, 15, 10, 2);
        g.fillStyle = "#ffffff"; g.fillRect(px + 4, 4, 2, 10);
      }
      panel(12); // DIŞ yüz — arkadan görünen (asıl tasarım)
      // İç astar aynı desenin KARARTILMIŞ hâli: katalogda hangi panelin
      // çizildiği bakınca anlaşılsın (arka panel çizilirse kart koyu çıkar).
      g.globalAlpha = 0.35;
      panel(1);
      g.globalAlpha = 1;
      // 1 piksellik kenar şeritleri (gerçek Mojang paftasındaki gibi)
      g.fillStyle = kenar; g.fillRect(1, 0, 10, 1); g.fillRect(11, 0, 10, 1);
      g.fillStyle = renk; g.fillRect(0, 1, 1, 16); g.fillRect(11, 1, 1, 16);
      return c.toDataURL("image/png");
    }

    var SKINLER = [
      { renkler: ["#f0c8a0", "#c0392b", "#3b2416"], ad: "Kızıl Şövalye", slim: false },
      { renkler: ["#e8b98c", "#2e86de", "#1b1b1f"], ad: "Mavi Kaşif", slim: true },
      { renkler: ["#8d5524", "#27ae60", "#2c1a0e"], ad: "Orman Bekçisi", slim: false },
      { renkler: ["#ffdbac", "#8e44ad", "#d4af37"], ad: "Mor Büyücü", slim: true },
    ];
    var kitaplik = SKINLER.map(function (s, i) {
      return {
        id: "k" + (i + 1),
        ad: s.ad,
        dosya: skinUrl(s.renkler[0], s.renkler[1], s.renkler[2]),
        slim: s.slim,
        kaynak: "editor",
        tarih: Date.now() - i * 3600000,
      };
    });
    var varsayilanlar = [
      { ad: "Steve", dosya: skinUrl("#c99e76", "#2e8b8b", "#3b2416"), slim: false },
      { ad: "Alex", dosya: skinUrl("#f0c8a0", "#3aa655", "#c98b3e"), slim: true },
    ];
    var pelerinler = [
      { id: "c1", ad: "Migrator", dosya: pelerinUrl("#c0392b", "#f1c40f"), aktif: true },
      { id: "c2", ad: "Mojang Studios", dosya: pelerinUrl("#1f2d3d", "#e67e22"), aktif: false },
      { id: "c3", ad: "Vanilla", dosya: pelerinUrl("#2c3e50", "#95a5a6"), aktif: false },
    ];
    var aktifSkin = { dosya: kitaplik[0].dosya, slim: kitaplik[0].slim, kaynak: "mojang" };
    var yedekVar = true;

    function aktifPelerin() {
      for (var i = 0; i < pelerinler.length; i++) if (pelerinler[i].aktif) return pelerinler[i].id;
      return null;
    }
    function hub() {
      return JSON.parse(JSON.stringify({
        premium: premium,
        cevrimdisi: false,
        aktif: aktifSkin,
        kitaplik: kitaplik,
        pelerinler: pelerinler,
        pelerin_aktif: aktifPelerin(),
        yedek_var: yedekVar,
        varsayilanlar: varsayilanlar,
        hata: premium ? null : "premium_gerekli",
      }));
    }
    function veriUrl(veri) {
      if (!veri || !veri.length) return null;
      var ikili = "";
      for (var i = 0; i < veri.length; i++) ikili += String.fromCharCode(veri[i] & 255);
      return "data:image/png;base64," + btoa(ikili);
    }
    function kayitBul(id) {
      for (var i = 0; i < kitaplik.length; i++) if (kitaplik[i].id === id) return kitaplik[i];
      return null;
    }

    var state = {
      config: {
        theme: "orange", last_selected_account: "a1", default_ram_mb: 4096,
        keep_launcher_open: true, show_news: true, stats_enabled: true,
        download_concurrency: 32, java_dir: null, custom_accent: "#ff7a1a",
        onboarding_done: !onboarding, guided_tour_done: true,
        // geliştirici harness'ı: rozet panelini görebilmek için yönetici adı
        atolye_admin: ["TestOyuncu"], atolye_izinli: ["YKSAMI1"],
        menu_animasyon: true, menu_animasyon_hiz: "normal", tema_ozel: {},
      },
      accounts: onboarding
        ? []
        : [{
            id: "a1", name: "TestOyuncu", kind: hesapTuru,
            uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5",
          }],
      instances: onboarding ? [] : [
        {
          id: "i1", name: "Test Kurulum", mc_version: "1.21.1", mod_loader: "fabric",
          ram_mb: 4096, icon: "🔥", cover: null, playtime_ms: 3600000,
          last_played: Date.now(), standard_mods: true, java_preset_id: "balanced",
          created_at: Date.now(),
        },
        {
          id: "i2", name: "PVP Paketi", mc_version: "1.21.11", mod_loader: "fabric",
          ram_mb: 6144, icon: "⚔️", cover: null, playtime_ms: 7200000,
          last_played: Date.now() - 86400000, standard_mods: true, java_preset_id: "aggressive",
          created_at: Date.now() - 604800000,
        },
      ],
      featured_versions: ["1.21.11"],
      curseforge: true,
      sys: { total_ram_mb: 16384, cores: 8 },
    };
    var calls = [];
    // KATALOG MOCK: 2 pelerin + 1 elitra (tuvallerden PNG üretilir)
    var kozKayitlar = null;
    var kozAktif = { pelerin: null, kanat: null };
    // Gerçek dosyalar gibi: yalnız GÖRÜNEN yüz paneli dolu, gerisi saydam.
    function kozPng(tur, renk, hd) {
      var N = hd ? 8 : 1;
      var c = document.createElement("canvas");
      c.width = 64 * N; c.height = 32 * N;
      var g = c.getContext("2d");
      var b = tur === "pelerin" ? { x: 12, y: 1, w: 10, h: 16 } : { x: 36, y: 2, w: 10, h: 20 };
      g.fillStyle = renk;
      g.fillRect(b.x * N, b.y * N, b.w * N, b.h * N);
      // HD'de ince detay (mozaik değil yumuşak görünmeli), pikselde 1 px şerit.
      g.fillStyle = "#ffffff";
      for (var i = 0; i < 6; i++) {
        var y = (b.y + 2 + i * (b.h - 4) / 6) * N;
        g.fillRect(b.x * N, y, b.w * N, Math.max(1, N / 2));
      }
      return c.toDataURL("image/png");
    }
    function kozKur() {
      if (kozKayitlar) return kozKayitlar;
      kozKayitlar = [
        { id: "pelerin-1", ad: "Pelerin 1", tur: "pelerin", hd: false, genislik: 64, yukseklik: 32, tarih: 3, dosya: kozPng("pelerin", "#2b8cff", false) },
        { id: "pelerin-2", ad: "Pelerin 2", tur: "pelerin", hd: true, genislik: 512, yukseklik: 256, tarih: 2, dosya: kozPng("pelerin", "#ff4d6d", true) },
        { id: "kanat-1", ad: "Elitra 1", tur: "kanat", hd: false, genislik: 64, yukseklik: 32, tarih: 1, dosya: kozPng("kanat", "#3ddc97", false) }
      ];
      kozAktif.pelerin = "pelerin-1";
      return kozKayitlar;
    }

    // Fotoğraf modu sayfa yenilenince de sürsün (gerçekte diskteki PNG gibi).
    var foto = {
      pelerin: sessionStorage.getItem("mock-foto-pelerin"),
      kanat: sessionStorage.getItem("mock-foto-kanat"),
    };
    function invoke(cmd, args) {
      calls.push(cmd);
      args = args || {};
      if (cmd === "cmd_get_state") return Promise.resolve(JSON.parse(JSON.stringify(state)));
      if (cmd === "cmd_save_settings") { Object.assign(state.config, args.config || {}); return Promise.resolve(true); }
      if (cmd === "cmd_list_news") return Promise.resolve([]);
      // Modlar sekmesi: liste yerel; logo/güncelleme çağrıları AĞI taklit edip
      // hiç dönmez — liste yine de hemen görünmeli (spinner'da kilitlenmemeli).
      if (cmd === "cmd_list_mods") return Promise.resolve([
        { filename: "sodium-0.6.0.jar", enabled: true, size: 1123456, modified: Date.now() },
        { filename: "iris-1.8.0.jar", enabled: false, size: 2234567, modified: Date.now() },
        { filename: "yikimlient-1.22.1.jar", enabled: true, size: 334567, modified: Date.now() },
      ]);
      if (cmd === "cmd_resolve_mod_icons") return Promise.resolve({
        "sodium-0.6.0.jar": "https://cdn.modrinth.com/xyz/sodium.png",
        "iris-1.8.0.jar": "",
      });
      // Mock güncelleme listesi (arayüz testi için sabit)
      if (cmd === "cmd_check_mod_updates") return Promise.resolve([
        { filename: "sodium-0.6.0.jar", yeni_ad: "sodium-0.7.0.jar", url: "https://x/sodium.jar", surum: "0.7.0" },
        { filename: "iris-1.8.0.jar", yeni_ad: "iris-1.9.0.jar", url: "https://x/iris.jar", surum: "1.9.0" },
      ]);
      if (cmd === "cmd_list_emotes") return Promise.resolve([
        { adi: "yerlesik-mambo-donus.json", baslik: "Mambo Dönüş", yerlesik: true, icerik: "{}" },
        { adi: "yerlesik-yaslanma.json", baslik: "Yaslanma", yerlesik: true, icerik: "{}" },
        { adi: "yerlesik-breakdance-flare.json", baslik: "Breakdance Flare", yerlesik: true, icerik: "{}" },
        { adi: "kendi-dans.json", baslik: "Kendi Dansım", yerlesik: false, icerik: "{}" },
      ]);
      if (cmd === "cmd_rozet_oku") return Promise.resolve({ pikseller: null });
      // HD fotoğraf kozmetiği: yüklenen PNG'yi data URL olarak tut, "oku"
      // komutu da onu dosya yolu gibi döndürsün (fotoğraf modu testi).
      if (cmd === "cmd_kozmetik_fotograf") {
        foto[String(args.tur)] = "data:image/png;base64," + String(args.png);
        try { sessionStorage.setItem("mock-foto-" + String(args.tur), foto[String(args.tur)]); } catch (e) {}
        return Promise.resolve({ kurulum: 2, yuklendi: true, hata: "", genislik: 640, yukseklik: 320 });
      }
      if (cmd === "cmd_kozmetik_oku") {
        var kozCevap = { pelerin: null, kanat: null, pelerin_dosya: foto.pelerin, kanat_dosya: foto.kanat };
        // Test: HD algılama gecikirse "Kaydet"e erken basma senaryosu.
        if (sessionStorage.getItem("mock-yavas-oku") === "1") {
          return new Promise(function (res) { setTimeout(function () { res(kozCevap); }, 1500); });
        }
        return Promise.resolve(kozCevap);
      }
      if (cmd === "cmd_kozmetik_kaydet") {
        window.__MOCK_KOZ__ = window.__MOCK_KOZ__ || [];
        window.__MOCK_KOZ__.push({ tur: args, bos: Object.keys(args || {}).map(function (k) {
          return Array.isArray(args[k]) && !args[k].some(function (p) { return String(p).trim(); });
        }) });
        return Promise.resolve({ kurulum: 2, yuklendi: true, hata: "" });
      }
      if (cmd === "cmd_rozet_ciz") return Promise.resolve({ kurulum: 2, yuklendi: true });
      if (cmd === "cmd_rozet_izinler") return Promise.resolve({ yuklendi: true });
      if (cmd === "cmd_add_offline_account") {
        var ad = String(args.name || "Oyuncu");
        state.accounts = [{ id: "off1", name: ad, kind: "offline", uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5" }];
        state.config.last_selected_account = "off1";
        return Promise.resolve(true);
      }
      if (cmd === "cmd_ms_login_begin") {
        premium = true;
        state.accounts = [{ id: "a1", name: "TestOyuncu", kind: "microsoft", uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5" }];
        state.config.last_selected_account = "a1";
        return Promise.resolve({ name: "TestOyuncu" });
      }
      if (cmd === "cmd_get_account_skin") {
        return Promise.resolve({
          dosya: aktifSkin ? aktifSkin.dosya : null,
          slim: aktifSkin ? aktifSkin.slim : false,
          pelerin: (function () {
            var id = aktifPelerin();
            for (var i = 0; i < pelerinler.length; i++) if (pelerinler[i].id === id) return pelerinler[i].dosya;
            return null;
          })(),
        });
      }
      // YIKIM kozmetik kataloğu (Skin Merkezi: "Pelerinlerim"/"Elitralarım")
      if (cmd === "cmd_kozm_katalog") {
        return Promise.resolve({ kayitlar: kozKur(), aktif: { pelerin: kozAktif.pelerin, kanat: kozAktif.kanat } });
      }
      if (cmd === "cmd_kozm_sec") {
        var kozTur = String(args.tur);
        kozAktif[kozTur] = args.id ? String(args.id) : null;
        return Promise.resolve({ aktif: { pelerin: kozAktif.pelerin, kanat: kozAktif.kanat }, yuklendi: true, hata: "" });
      }
      if (cmd === "cmd_kozm_sil") {
        kozKayitlar = kozKur().filter(function (k) { return k.id !== String(args.id); });
        if (kozAktif.pelerin === args.id) kozAktif.pelerin = null;
        if (kozAktif.kanat === args.id) kozAktif.kanat = null;
        return Promise.resolve({ kayitlar: kozKayitlar, aktif: { pelerin: kozAktif.pelerin, kanat: kozAktif.kanat } });
      }

      // ---------- güvenlik (mock) ----------
      if (cmd === "cmd_guvenlik_ozet") {
        var gvDog = sessionStorage.getItem("mock-gv-dogrulandi") === "1";
        return Promise.resolve({
          hesaplar: (state.accounts || []).map(function (a) {
            return {
              id: a.id, anahtar: (a.kind === "microsoft" ? "ms:" : "offline:") + a.uuid,
              ad: a.name, dogrulandi: gvDog, rol_yol: gvDog, carpi: !gvDog,
              kozmetik_serbest: gvDog, cizim_serbest: gvDog,
            };
          }),
        });
      }
      if (cmd === "cmd_guvenlik_durum") {
        var gvBagli = sessionStorage.getItem("mock-gv-bagli") === "1";
        var gvDog2 = sessionStorage.getItem("mock-gv-dogrulandi") === "1";
        var gvKapali = sessionStorage.getItem("mock-gv-kapali") === "1";
        var gvAcc = state.accounts && state.accounts[0];
        return Promise.resolve({
          cihaz_hazir: true, cihaz_id: "mock-cihaz", api_acik: !gvKapali,
          bot_acik: !gvKapali && gvBagli, sunucu_anahtar: "mock",
          hesap: gvAcc ? { anahtar: (gvAcc.kind === "microsoft" ? "ms:" : "offline:") + gvAcc.uuid, ad: gvAcc.name, tur: gvAcc.kind, uuid: gvAcc.uuid } : null,
          baglandi: gvBagli, dogrulandi: gvDog2, discord_ad: gvBagli ? "sami" : "", neden: gvBagli ? "" : "baglanti_yok",
          yetki: { dogrulandi: gvDog2, rol_yol: gvDog2, sahip_kilidi: false },
          kozmetik_serbest: gvDog2, cizim_serbest: gvDog2, carpi: !gvDog2,
        });
      }
      if (cmd === "cmd_guvenlik_baglama_kod") return Promise.resolve({ kod: "K7M2P9QX", kalan_sn: 600 });
      if (cmd === "cmd_guvenlik_baglama_durum") {
        if (sessionStorage.getItem("mock-gv-bekle") === "1") return Promise.resolve({ baglandi: false });
        sessionStorage.setItem("mock-gv-bagli", "1");
        return Promise.resolve({ baglandi: true, discord_ad: "sami", rol_yol: false });
      }
      if (cmd === "cmd_guvenlik_parola_kur") {
        if (sessionStorage.getItem("mock-gv-bagli") !== "1") return Promise.reject("baglanti_yok");
        return Promise.resolve({ tamam: true });
      }
      if (cmd === "cmd_guvenlik_giris") {
        sessionStorage.setItem("mock-gv-dogrulandi", "1");
        return Promise.resolve({ dogrulandi: true, rol_yol: false, yetki_bitis: Date.now() + 604800000 });
      }
      if (cmd === "cmd_guvenlik_sifirla") {
        sessionStorage.setItem("mock-gv-dogrulandi", "1");
        return Promise.resolve({ tamam: true });
      }
      if (cmd === "cmd_hesap_yetki") {
        var gvDog3 = sessionStorage.getItem("mock-gv-dogrulandi") === "1";
        return Promise.resolve({ dogrulandi: gvDog3, rol_yol: gvDog3, kozmetik_serbest: gvDog3, cizim_serbest: gvDog3, carpi: !gvDog3 });
      }

      if (cmd === "cmd_update_mod") return Promise.resolve(String(args.yeniAd || "mod.jar"));
      if (cmd === "cmd_update_all_mods") return Promise.resolve({
        toplam: 3, basarili: 3, hata: 0, hatalar: [], bos: false,
      });
      // ---------- çoklu mod paketi kurulumu (mock) ----------
      // Aynı paket iki kez: sunucu reddeder (Rust kilidi).
      if (cmd === "cmd_install_pack_files") {
        var kilitAnahtar = "kurulum:" + String(args.projectId || "x");
        if (sessionStorage.getItem(kilitAnahtar) === "1") {
          return Promise.reject("paket_zaten_kuruluyor:" + kilitAnahtar);
        }
        sessionStorage.setItem(kilitAnahtar, "1");
        setTimeout(function () { sessionStorage.removeItem(kilitAnahtar); }, 4000);
        state.instances.unshift({
          id: "ip" + Date.now(), name: String(args.packName || "Yeni Paket"), mc_version: "1.21.1",
          mod_loader: "fabric", ram_mb: 4096, icon: args.icon || "📦", playtime_ms: 0,
        });
        window.__PAKET_HAZIR__ = { instance_id: state.instances[0].id, ad: state.instances[0].name };
        return Promise.resolve(state.instances[0]);
      }
      if (cmd === "cmd_skin_hub") return Promise.resolve(hub());
      if (cmd === "cmd_skin_giy") {
        var url = veriUrl(args.veri);
        if (url) aktifSkin = { dosya: url, slim: !!args.slim, kaynak: "mojang" };
        if (args.ad) {
          kitaplik.unshift({
            id: "k" + Date.now(), ad: String(args.ad), dosya: url,
            slim: !!args.slim, kaynak: "editor", tarih: Date.now(),
          });
        }
        return Promise.resolve(hub());
      }
      if (cmd === "cmd_skin_giy_kitaplik") {
        var kayit = kayitBul(args.kayitId);
        if (!kayit) return Promise.reject("Skin bulunamadı.");
        aktifSkin = { dosya: kayit.dosya, slim: kayit.slim, kaynak: "mojang" };
        return Promise.resolve(hub());
      }
      if (cmd === "cmd_skin_pelerin") {
        var secili = args.capeId || null;
        for (var pi = 0; pi < pelerinler.length; pi++) pelerinler[pi].aktif = pelerinler[pi].id === secili;
        return Promise.resolve(hub());
      }
