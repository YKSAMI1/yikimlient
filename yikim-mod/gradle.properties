# Gradle JVM'i JDK 25: Loom 1.18 ve Minecraft 1.21.9+ bunu ister. Bayt kodu hedefi
# yine 21 (1.21.x oyunları Java 21'de çalışır), bkz. build.gradle.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-25.0.3
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Varsayılan hedef. scripts/build-mod.sh her Minecraft sürümü için bunları değiştirir:
#   gradle build -Pminecraft_version=1.21.11 -Pfabric_version=0.141.6+1.21.11 -Padapter=modern
minecraft_version=1.21.11
loader_version=0.19.5
fabric_version=0.141.6+1.21.11
adapter=modern

# Mod
mod_version=1.13.2
maven_group=com.yikimlient
archives_base_name=yikimlient
